{% set name = "climada" %}
{% set version = "6.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/climada-{{ version }}.tar.gz
  sha256: 37ad507618c3a05bfab9e2ad77c96f8a7be22ca52ff06c1fcd11c22c079c2f07

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }},<3.14
    - affine =2.4
    - bayesian-optimization =1.5
    - bottleneck =1.6
    - cartopy =0.25
    - cfgrib =0.9
    - contextily =1.7
    - dask =2026.8
    - deprecation =2.1
    - eccodes =2.47
    - fiona =1.10
    - gdal =3.12
    - geopandas =1.1
    - h5py =3.16
    - haversine =2.9
    - matplotlib-base =3.10
    - netcdf4 =1.7
    - numba =0.67
    - numexpr =2.14
    - openpyxl =3.1
    - osm-flex =1.1
    - overpy =0.7
    - pandas =2.2
    - pathos =0.3
    - peewee =4.4
    - pillow =13.0
    - pint =0.25
    - pyarrow =24.0
    - pycountry =24.6
    - pyproj =3.7
    - pytables =3.11
    - python =3.11
    - pyxlsb =1.0
    - rasterio =1.4
    - requests =2.34
    - rtree =1.4
    - salib =1.5
    - scikit-learn =1.9
    - scipy =1.17
    - seaborn =0.13
    - sparse =0.19
    - statsmodels =0.15
    - tabulate =0.10
    - tqdm =4.70
    - unittest-xml-reporting =3.2
    - xarray =2026.7
    - xlrd =2.0
    - xlsxwriter =3.2

test:
  imports:
    - climada
  source_files:
    - climada
  commands:
    - pip check
    - python3 -m unittest climada.engine.test.test_impact
  requires:
    - lxml
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/CLIMADA-project/climada_python
  summary: "CLIMADA: Probabilistic natural catastrophe impact model in Python"
  description: |
    CLIMADA (CLIMate ADAptation) is a free and open-source software framework
    for climate risk assessment and adaptation option appraisal. Designed by a
    large scientific community, it helps reasearchers, policymakers, and
    businesses analyse the impacts of natural hazards and explore adaptation
    strategies. 
  license: GPL-3.0-only
  license_file: LICENSE
  doc_url: https://climada-python.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - emanuel-schmid
    - peanutfun
